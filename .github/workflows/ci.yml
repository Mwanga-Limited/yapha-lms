name: CI

# The job ids below (backend, frontend, image, e2e) are the required status checks in deploy/github/ruleset.json.
# Rename one here and you must rename it there, or nothing can be merged.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: yapha_lms_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The tests erase this database, and refuse to run unless its name contains "test".
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/yapha_lms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      # Advisory for now: oxlint reports a real error in src/pages/student/Player.tsx. Remove continue-on-error once it is fixed.
      - run: npm run lint
        working-directory: frontend
        continue-on-error: true
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image (not pushed)
        run: docker build -t yapha-lms:ci .
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: yapha-lms:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test (database + migrations + app + health check)
        run: |
          set -euo pipefail
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_PASSWORD=pw postgres:18
          # Ask over TCP, not the socket: during first start Postgres runs a temporary socket-only server and then restarts,
          # so a socket check can pass just before the real server comes up.
          for i in $(seq 1 60); do
            docker exec db psql -h 127.0.0.1 -U postgres -tAc 'select 1' >/dev/null 2>&1 && break
            [ "$i" = 60 ] && { docker logs db; echo "database never came up"; exit 1; }
            sleep 2
          done
          # Same shape as production (deploy/initdb): the app connects as a NON-superuser that owns its database.
          docker exec db psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE yapha LOGIN CREATEROLE PASSWORD 'pw'" -c "CREATE DATABASE yapha_lms OWNER yapha"
          SECRET=$(openssl rand -base64 48); TOTP=$(openssl rand -base64 32); DATAKEY=$(openssl rand -base64 48)
          ENVS=(-e DATABASE_URL=postgres://yapha:pw@db:5432/yapha_lms -e "JWT_SECRET=$SECRET" -e "TOTP_ENCRYPTION_KEY=$TOTP" -e "DATA_ENCRYPTION_KEY=$DATAKEY"
                -e MAIL_TRANSPORT=smtp -e SMTP_HOST=localhost -e "MAIL_FROM=CI <ci@example.com>" -e APP_URL=http://localhost:8080)
          docker run --rm --network ci "${ENVS[@]}" yapha-lms:ci sh -c "node src/scripts/migrate.js && node src/scripts/encrypt-totp-secrets.js"
          docker run -d --name app --network ci -p 8080:8080 "${ENVS[@]}" yapha-lms:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/health && exit 0; sleep 2; done
          docker logs app; exit 1

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: yapha_lms }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/yapha_lms
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/yapha_lms
      E2E_ORG: yapha
      MAIL_TRANSPORT: console
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      PORT: "4000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm ci && npm run migrate
        working-directory: backend
      - name: Start the app and wait until it is healthy
        working-directory: backend
        run: |
          FRONTEND_DIST=../frontend/dist nohup node src/server.js > ../server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4000/api/health >/dev/null && exit 0; sleep 2; done
          cat ../server.log; exit 1
      - run: npx playwright install --with-deps chromium && npm run e2e
        working-directory: frontend
      - name: Show the server log if the tests failed
        if: failure()
        run: cat server.log
